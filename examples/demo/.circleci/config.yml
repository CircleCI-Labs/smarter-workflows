# The setup config of the demo monorepo: the reference setup job of this
# repository (../../../.circleci/config.yml) with the demo's own settings.
#
# Default: build the planner from this checkout (see the plan job below).
# Learned layer cache prefix: smarter-demo-learned-v1 (not a prefix of the main
# repo's smarter-learned-v1).
version: 2.1

setup: true

jobs:
  plan:
    docker:
      - image: cimg/go:1.27.3
    resource_class: medium
    steps:
      - checkout
      - run:
          name: "smarter: pick the version"
          command: |
            set -eu
            mkdir -p /tmp/smarter/bin /tmp/smarter/plan
            printf 'dev-%s\n' "$CIRCLE_SHA1" > .smarter-version
      - restore_cache:
          keys:
            - smarter-bin-v1-{{ checksum ".smarter-version" }}-{{ arch }}
      - run:
          name: "smarter: build"
          command: |
            set -eu
            if [ -x /tmp/smarter/bin/circleci-smarter ]; then
              echo "smarter: using the cached binary"
              exit 0
            fi
            CGO_ENABLED=0 go build -ldflags "-X main.version=dev-$CIRCLE_SHA1" -o /tmp/smarter/bin/circleci-smarter ./cmd/circleci-smarter
      - save_cache:
          key: smarter-bin-v1-{{ checksum ".smarter-version" }}-{{ arch }}
          paths:
            - /tmp/smarter/bin
      - restore_cache:
          keys:
            - smarter-demo-learned-v1-
          paths:
            - /tmp/smarter
      - run:
          name: "smarter: base"
          command: |
            set -eu
            /tmp/smarter/bin/circleci-smarter version
            /tmp/smarter/bin/circleci-smarter base --default-branch main > .smarter-key
      - run:
          name: "smarter: plan"
          environment:
            SMARTER_ARG_TRIGGER_TYPE: "<< pipeline.trigger.type >>"
          command: |
            set -eu
            set -- plan \
              --config examples/demo/.circleci/continue.yml \
              --workflow demo \
              --default-branch main \
              --mode select \
              --mandatory security-scan \
              --policy-bundle policies \
              --full-run-paths 'examples/demo/.circleci/**' \
              --analyze-report /tmp/smarter/plan/analyze-report.md
            if [ -n "$SMARTER_ARG_TRIGGER_TYPE" ]; then
              set -- "$@" --trigger-type "$SMARTER_ARG_TRIGGER_TYPE"
            fi
            if [ -s /tmp/smarter/learned.json ]; then
              set -- "$@" --learned /tmp/smarter/learned.json
            fi
            /tmp/smarter/bin/circleci-smarter "$@"
      - store_artifacts:
          path: /tmp/smarter/plan
          destination: smarter-plan
      - run:
          name: "smarter: continue"
          command: |
            set -eu
            /tmp/smarter/bin/circleci-smarter continue --config /tmp/smarter/continue.yml

  learn:
    docker:
      - image: cimg/go:1.27.3
    resource_class: medium
    steps:
      - checkout
      - run:
          name: "smarter: fetch full history"
          command: |
            set -eu
            git fetch --unshallow 2>/dev/null || git fetch --depth=100000
      - run:
          name: "smarter: pick the version"
          command: |
            set -eu
            mkdir -p /tmp/smarter/bin /tmp/smarter/learn
            printf 'dev-%s\n' "$CIRCLE_SHA1" > .smarter-version
      - restore_cache:
          keys:
            - smarter-bin-v1-{{ checksum ".smarter-version" }}-{{ arch }}
      - run:
          name: "smarter: build"
          command: |
            set -eu
            if [ -x /tmp/smarter/bin/circleci-smarter ]; then
              echo "smarter: using the cached binary"
              exit 0
            fi
            CGO_ENABLED=0 go build -ldflags "-X main.version=dev-$CIRCLE_SHA1" -o /tmp/smarter/bin/circleci-smarter ./cmd/circleci-smarter
      - restore_cache:
          keys:
            - smarter-demo-learned-v1-
          paths:
            - /tmp/smarter
      - run:
          name: "smarter: learn"
          environment:
            PROJECT_SLUG: "<< pipeline.project.slug >>"
          command: |
            set -eu
            set -- learn \
              --project-slug "$PROJECT_SLUG" \
              --workflow demo \
              --limit 200 \
              --config examples/demo/.circleci/continue.yml \
              --learned-out /tmp/smarter/learned.json \
              --report /tmp/smarter/learn/learn.md \
              --report-json /tmp/smarter/learn/learn.json
            if [ -s /tmp/smarter/learned.json ]; then
              cp /tmp/smarter/learned.json /tmp/smarter/learned-prev.json
              set -- "$@" --learned /tmp/smarter/learned-prev.json
            fi
            /tmp/smarter/bin/circleci-smarter "$@"
      - save_cache:
          key: smarter-demo-learned-v1-{{ epoch }}
          paths:
            - /tmp/smarter/learned.json
      - store_artifacts:
          path: /tmp/smarter/learn
          destination: smarter-learn
      - run:
          name: "smarter: learn summary"
          when: always
          command: |
            if [ ! -f /tmp/smarter/learn/learn.md ]; then
              echo "smarter: no learn report (learn step failed or was skipped)"
              exit 0
            fi
            awk 'BEGIN{p=0} /^## Summary$/{p=1;print;next} p&&/^## /{exit} p' /tmp/smarter/learn/learn.md
      - run:
          name: "smarter: continue (scheduled full run)"
          when: always
          command: |
            set -eu
            /tmp/smarter/bin/circleci-smarter plan \
              --config examples/demo/.circleci/continue.yml \
              --workflow demo \
              --default-branch main \
              --mode select \
              --mandatory security-scan \
              --trigger-type schedule \
              --policy-bundle policies \
              --full-run-paths 'examples/demo/.circleci/**' \
              --out /tmp/smarter/continue.yml
            /tmp/smarter/bin/circleci-smarter continue --config /tmp/smarter/continue.yml

workflows:
  demo-plan:
    when:
      not:
        equal: [schedule, << pipeline.trigger.type >>]
    jobs:
      - plan
  demo-learn:
    when:
      equal: [schedule, << pipeline.trigger.type >>]
    jobs:
      - learn:
          context:
            - smarter-workflows-ai