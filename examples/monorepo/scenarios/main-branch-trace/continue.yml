# Example continuation config for a small monorepo.
#
# This is the "catalog" of docs/adr/0004: plain CircleCI config, with nothing
# Smarter-specific in it. `circleci-smarter plan` prunes the `ci` workflow down
# to the jobs a change can reach and adds a `smarter-gate` job that waits for
# them; everything else here passes through untouched.
version: 2.1
executors:
  go:
    docker:
      - image: cimg/go:1.26
  node:
    docker:
      - image: cimg/node:24
jobs:
  # Repo-wide checks: reads nearly every file, so most changes select it.
  lint:
    executor: go
    steps:
      - checkout
      - run:
          name: 'smarter: reset atime'
          shell: /bin/sh
          command: |
            # stub: the post-checkout reset of internal/tracescript
            true
      - run:
          name: Lint
          command: make lint
  # The two services read different directories, and both read libs/shared.
  api-test:
    executor: go
    steps:
      - checkout
      - run:
          name: 'smarter: reset atime'
          shell: /bin/sh
          command: |
            # stub: the post-checkout reset of internal/tracescript
            true
      - run:
          name: Test the API
          command: make -C services/api test
  web-test:
    executor: node
    steps:
      - checkout
      - run:
          name: 'smarter: reset atime'
          shell: /bin/sh
          command: |
            # stub: the post-checkout reset of internal/tracescript
            true
      - run:
          name: Test the web app
          command: npm --prefix services/web test
  # build leaves its output in a workspace and e2e picks it up. A change that
  # selects build also selects e2e, whatever e2e itself reads.
  build:
    executor: go
    steps:
      - checkout
      - run:
          name: 'smarter: reset atime'
          shell: /bin/sh
          command: |
            # stub: the post-checkout reset of internal/tracescript
            true
      - run:
          name: Build
          command: make build
      - persist_to_workspace:
          root: .
          paths:
            - dist
  e2e:
    executor: node
    steps:
      - checkout
      - run:
          name: 'smarter: reset atime'
          shell: /bin/sh
          command: |
            # stub: the post-checkout reset of internal/tracescript
            true
      - attach_workspace:
          at: .
      - run:
          name: End-to-end tests
          command: make e2e
  docs:
    executor: node
    steps:
      - checkout
      - run:
          name: 'smarter: reset atime'
          shell: /bin/sh
          command: |
            # stub: the post-checkout reset of internal/tracescript
            true
      - run:
          name: Build the docs
          command: make docs
  # Mandatory: it runs in every pipeline (--mandatory security-scan), and the
  # guardrail bundle requires it in every workflow.
  security-scan:
    executor: go
    steps:
      - checkout
      - run:
          name: 'smarter: reset atime'
          shell: /bin/sh
          command: |
            # stub: the post-checkout reset of internal/tracescript
            true
      - run:
          name: Scan the dependencies
          command: make scan
  deploy:
    executor: go
    steps:
      - checkout
      - run:
          name: 'smarter: reset atime'
          shell: /bin/sh
          command: |
            # stub: the post-checkout reset of internal/tracescript
            true
      - attach_workspace:
          at: .
      - run:
          name: Deploy
          command: ./scripts/deploy.sh
  smarter-impact-map:
    docker:
      - image: cimg/base:2026.11
    resource_class: small
    steps:
      - run:
          name: 'smarter: write version'
          command: |
            printf '%s\n' dev-example > .smarter-version
      - restore_cache:
          key: smarter-bin-v1-{{ checksum ".smarter-version" }}-{{ arch }}
      - attach_workspace:
          at: /tmp/smarter
      - run:
          name: 'smarter: build impact map'
          command: |
            /usr/local/bin/circleci-smarter map build --traces /tmp/smarter/traces --revision "$CIRCLE_SHA1" --out /tmp/smarter/impact-map.json.gz
      - run:
          name: 'smarter: write cache key'
          command: |
            printf '%s\n' "$CIRCLE_SHA1" > .smarter-key
      - save_cache:
          key: smarter-impact-v1-{{ checksum ".smarter-key" }}
          paths:
            - /tmp/smarter/impact-map.json.gz
      - store_artifacts:
          path: /tmp/smarter/impact-map.json.gz
  smarter-gate:
    type: no-op
workflows:
  ci:
    jobs:
      - lint:
          post-steps:
            - run:
                name: 'smarter: collect trace'
                when: always
                shell: /bin/sh
                command: |
                  # stub: the trace collector of internal/tracescript
                  true
            - persist_to_workspace:
                root: /tmp/smarter
                paths:
                  - traces
      - security-scan:
          post-steps:
            - run:
                name: 'smarter: collect trace'
                when: always
                shell: /bin/sh
                command: |
                  # stub: the trace collector of internal/tracescript
                  true
            - persist_to_workspace:
                root: /tmp/smarter
                paths:
                  - traces
      - api-test:
          requires:
            - lint
          post-steps:
            - run:
                name: 'smarter: collect trace'
                when: always
                shell: /bin/sh
                command: |
                  # stub: the trace collector of internal/tracescript
                  true
            - persist_to_workspace:
                root: /tmp/smarter
                paths:
                  - traces
      - web-test:
          requires:
            - lint
          post-steps:
            - run:
                name: 'smarter: collect trace'
                when: always
                shell: /bin/sh
                command: |
                  # stub: the trace collector of internal/tracescript
                  true
            - persist_to_workspace:
                root: /tmp/smarter
                paths:
                  - traces
      - build:
          requires:
            - lint
          post-steps:
            - run:
                name: 'smarter: collect trace'
                when: always
                shell: /bin/sh
                command: |
                  # stub: the trace collector of internal/tracescript
                  true
            - persist_to_workspace:
                root: /tmp/smarter
                paths:
                  - traces
      - e2e:
          requires:
            - build
          post-steps:
            - run:
                name: 'smarter: collect trace'
                when: always
                shell: /bin/sh
                command: |
                  # stub: the trace collector of internal/tracescript
                  true
            - persist_to_workspace:
                root: /tmp/smarter
                paths:
                  - traces
      - docs:
          post-steps:
            - run:
                name: 'smarter: collect trace'
                when: always
                shell: /bin/sh
                command: |
                  # stub: the trace collector of internal/tracescript
                  true
            - persist_to_workspace:
                root: /tmp/smarter
                paths:
                  - traces
      # Deploys wait for a person, and only happen on main.
      - hold-deploy:
          type: approval
          requires:
            - e2e
            - api-test
            - web-test
            - security-scan
          filters:
            branches:
              only: main
      - deploy:
          requires:
            - hold-deploy
          context: deploy
          filters:
            branches:
              only: main
          post-steps:
            - run:
                name: 'smarter: collect trace'
                when: always
                shell: /bin/sh
                command: |
                  # stub: the trace collector of internal/tracescript
                  true
            - persist_to_workspace:
                root: /tmp/smarter
                paths:
                  - traces
      - smarter-impact-map:
          requires:
            - lint
            - security-scan
            - api-test
            - web-test
            - build
            - e2e
            - docs
      - smarter-gate:
          requires:
            - lint
            - security-scan
            - api-test
            - web-test
            - build
            - e2e
            - docs
