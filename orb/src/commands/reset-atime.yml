description: >
  Run this right after checkout in a job you want traced. Checkout reads every
  file, so this puts every atime back to the epoch and records whether atime
  works on this filesystem, so that collect-trace can tell what the job read.
  The planner adds the same step itself to the jobs it traces. It needs GNU
  touch and find (a cimg image); elsewhere the trace says it is unsupported
  and the job always runs.
steps:
  - run:
      name: "smarter: reset atime"
      shell: /bin/sh
      command: <<include(scripts/reset-atime.sh)>>
