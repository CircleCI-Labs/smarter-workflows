description: >
  Run this last in a traced job: it writes the job's trace to
  /tmp/smarter/traces and persists it to the workspace. The planner adds the
  same post-step itself to the jobs it traces on the default branch.
steps:
  - run:
      name: "smarter: collect trace"
      when: always
      shell: /bin/sh
      command: <<include(scripts/collect-trace.sh)>>
  - persist_to_workspace:
      root: /tmp/smarter
      paths:
        - traces
