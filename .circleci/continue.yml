# The full pipeline of this repo: the catalog that the planner of
# .circleci/config.yml prunes. Plain CircleCI config, nothing Smarter-specific.
#
# Every job pins its image (tag and digest, the tag at least a week old) and
# sets its resource class. The workflow `ci` needs no pipeline parameters.
version: 2.1

commands:
  # The CircleCI CLI, pinned: the release is checked against its sha256 (the
  # digest GitHub publishes for the asset). Jobs that run `circleci config validate`
  # use the smarter-workflows-ci context (CIRCLE_TOKEN).
  install-circleci-cli:
    steps:
      - run:
          name: Install the CircleCI CLI
          command: |
            set -eu
            version=1.6.0
            sha256=20296c88505342996693b657e7bd7fc7862e1779fc000b869fcc5b9870f4417e
            archive="circleci-cli_${version}_linux_amd64.tar.gz"
            curl -fsSL --retry 3 -o "/tmp/${archive}" "https://github.com/CircleCI-Public/circleci-cli/releases/download/v${version}/${archive}"
            echo "${sha256}  /tmp/${archive}" | sha256sum -c -
            mkdir -p "$HOME/bin"
            tar -xzf "/tmp/${archive}" -C "$HOME/bin" circleci
            circleci --version

  # The docs site (site/, CONTRIBUTING.md "Documentation site"): Hugo and lychee, each pinned by its version and the SHA-256
  # of its download (the digest GitHub publishes for the asset; a new version needs its new checksum), the staged Markdown,
  # `hugo --minify` and the offline check of every link and heading anchor. The site is in site/public afterwards. The Hextra
  # theme is the Go module that site/go.mod and site/go.sum pin, and GOFLAGS=-mod=readonly keeps Go from changing them.
  docs-site:
    steps:
      - run:
          name: Install Hugo (extended) and lychee, checked against their SHA-256
          command: |
            set -eu
            hugo_version=0.168.0
            hugo_sha256=787f100057328824f38c6ad7c87ff10d6451ae0a7bc39cedaad0dd2bcde17e53
            lychee_version=0.24.2
            lychee_sha256=73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5
            mkdir -p "$HOME/.local/bin"
            curl -fsSL --retry 5 --retry-all-errors -o /tmp/hugo.tgz "https://github.com/gohugoio/hugo/releases/download/v${hugo_version}/hugo_extended_${hugo_version}_linux-amd64.tar.gz"
            echo "${hugo_sha256}  /tmp/hugo.tgz" | sha256sum -c -
            tar -xzf /tmp/hugo.tgz -C "$HOME/.local/bin" hugo
            curl -fsSL --retry 5 --retry-all-errors -o /tmp/lychee.tgz "https://github.com/lycheeverse/lychee/releases/download/lychee-v${lychee_version}/lychee-x86_64-unknown-linux-musl.tar.gz"
            echo "${lychee_sha256}  /tmp/lychee.tgz" | sha256sum -c -
            tar -xzf /tmp/lychee.tgz -C "$HOME/.local/bin" --strip-components=1 lychee-x86_64-unknown-linux-musl/lychee
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            "$HOME/.local/bin/hugo" version
            "$HOME/.local/bin/lychee" --version
      - run:
          name: Stage the Markdown as Hugo content (site/stage.sh)
          command: site/stage.sh
      - run:
          name: hugo --minify (warnings fail the build)
          working_directory: site
          environment:
            GOFLAGS: -mod=readonly
          command: hugo --minify --panicOnWarning
      - run:
          name: lychee --offline on the built site (links and heading anchors, site/check.sh)
          command: site/check.sh

jobs:
  go-test:
    docker:
      - image: cimg/go:1.27.3
    resource_class: medium
    steps:
      - checkout
      - install-circleci-cli
      - run:
          name: go test
          # The planner's tests validate every config it emits with the CLI, so
          # a missing CLI or an unreachable API must fail here, not skip.
          environment:
            REQUIRE_CIRCLECI_CLI: "1"
          command: go test ./...

  go-lint:
    docker:
      - image: cimg/go:1.27.3
    resource_class: medium
    steps:
      - checkout
      - run:
          name: gofmt
          command: |
            unformatted="$(gofmt -l .)"
            if [ -n "$unformatted" ]; then
              echo "gofmt would change:" >&2
              echo "$unformatted" >&2
              exit 1
            fi
      - run:
          name: go vet
          command: go vet ./...

  policy-test:
    docker:
      - image: cimg/go:1.27.3
    resource_class: medium
    steps:
      - checkout
      - install-circleci-cli
      - run:
          name: Go tests of the policy package
          command: go test ./internal/policy/...
      # The Rego tests need the helpers that CircleCI's policy runtime adds
      # (data.circleci.utils), which plain OPA does not have: the CLI runs them.
      - run:
          name: Rego tests of the guardrail bundle
          command: circleci policy test policies

  script-test:
    docker:
      - image: cimg/base:2026.11@sha256:4e57f523172e8f5bbf9cb57393b80c964ac0e6c75ee70ebd8c980d11bb503c01
    resource_class: small
    steps:
      - checkout
      # The shellcheck of the image (an apt package, so pinned by the image).
      - run:
          name: shellcheck
          command: |
            shellcheck --version
            shellcheck -s sh orb/src/scripts/*.sh scripts/*.sh scripts/bench/*.sh
      - run:
          name: Bench fixture parse
          command: scripts/bench/test-parse.sh
      - run:
          name: Tests of the orb install script
          command: scripts/test-install.sh
      - run:
          name: GitHub slug from CI environment
          command: scripts/test-github-slug.sh

  release-dry-run:
    docker:
      - image: cimg/go:1.27.3
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Release dry run
          command: scripts/test-release-dry-run.sh

  orb-validate:
    docker:
      - image: cimg/base:2026.11@sha256:4e57f523172e8f5bbf9cb57393b80c964ac0e6c75ee70ebd8c980d11bb503c01
    resource_class: small
    steps:
      - checkout
      - install-circleci-cli
      - run:
          name: Validate the orb
          # Inlines the packed orb and validates with circleci config validate
          # (needs CIRCLE_TOKEN from smarter-workflows-ci).
          command: scripts/validate-orb.sh orb/src
      - run:
          name: Orb integration (inline pack, monorepo plan)
          command: scripts/test-orb-integration.sh orb/src
      - run:
          name: Validate the setup config and the continuation config
          command: |
            circleci config validate .circleci/config.yml
            circleci config validate .circleci/continue.yml

  security-scan:
    docker:
      - image: cimg/go:1.27.3
    resource_class: medium
    steps:
      - checkout
      # go install checks the module against the checksum database.
      - run:
          name: Install govulncheck
          command: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run:
          name: govulncheck
          command: |
            "$(go env GOPATH)/bin/govulncheck" ./...

  # The docs site builds, and its links and heading anchors check out. It reads only the Markdown pages that site/nav.txt
  # lists, the docs directory and the files of site/, so the planner skips it for a change that touches none of them. It has
  # no context: no token is in the environment of Hugo, lychee, the Go modules or the scripts of site/. The publication is
  # the job docs-site-publish, in the workflow docs-site.
  docs-site-build:
    docker:
      - image: cimg/go:1.27.3
    resource_class: small
    steps:
      - checkout
      - docs-site
      - run:
          name: Pack the site
          command: |
            set -eu
            mkdir -p /tmp/docs-site
            tar -czf /tmp/docs-site/docs-site.tgz -C site/public .
      - store_artifacts:
          path: /tmp/docs-site
          destination: docs-site

  # Builds the site again, with the same steps, and pushes it to the gh-pages branch (site/publish.sh). Without GITHUB_TOKEN in
  # the context the job builds and checks the site and publishes nothing.
  docs-site-publish:
    docker:
      - image: cimg/go:1.27.3
    resource_class: small
    environment:
      GITHUB_REPOSITORY: CircleCI-Labs/smarter-workflows
    steps:
      - checkout
      # The build comes first: a site that does not build is not published.
      - docs-site
      - run:
          name: Publish to gh-pages (nothing is published without GITHUB_TOKEN)
          command: site/publish.sh

  build:
    docker:
      - image: cimg/go:1.27.3
    resource_class: medium
    steps:
      - checkout
      - run:
          name: go build
          command: |
            set -eu
            mkdir -p /tmp/workspace
            CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=dev-$CIRCLE_SHA1" -o /tmp/workspace/circleci-smarter ./cmd/circleci-smarter
            /tmp/workspace/circleci-smarter version
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - circleci-smarter

  e2e-plan:
    docker:
      - image: cimg/base:2026.11@sha256:4e57f523172e8f5bbf9cb57393b80c964ac0e6c75ee70ebd8c980d11bb503c01
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
      # Run the built binary on the example monorepo. Before the example exists, run `version`.
      - run:
          name: Plan the example
          command: |
            set -eu
            bin=/tmp/workspace/circleci-smarter
            mkdir -p /tmp/e2e
            if [ -f examples/monorepo/continue.yml ]; then
              "$bin" plan --config examples/monorepo/continue.yml --force-full --out /tmp/e2e/continue.yml --report-dir /tmp/e2e/plan
              test -s /tmp/e2e/continue.yml
              test -s /tmp/e2e/plan/plan.json
              grep -q smarter-gate /tmp/e2e/continue.yml
            else
              "$bin" version
            fi
      - store_artifacts:
          path: /tmp/e2e
          destination: e2e-plan

  release:
    docker:
      - image: cimg/go:1.27.3
    resource_class: medium
    environment:
      GITHUB_REPOSITORY: CircleCI-Labs/smarter-workflows
    steps:
      - checkout
      - run:
          name: Install release tools
          command: scripts/release.sh install-tools
      - run:
          name: Build, sign and publish release assets
          environment:
            PIPELINE_DEFINITION_ID: "<< pipeline.definition.id >>"
          command: scripts/release.sh
      - store_artifacts:
          path: /tmp/release
          destination: release

  orb-publish-dev:
    docker:
      - image: cimg/base:2026.11@sha256:4e57f523172e8f5bbf9cb57393b80c964ac0e6c75ee70ebd8c980d11bb503c01
    resource_class: small
    steps:
      - checkout
      - install-circleci-cli
      - run:
          name: Publish dev orb
          command: scripts/publish-orb.sh dev

  orb-publish-prod:
    docker:
      - image: cimg/base:2026.11@sha256:4e57f523172e8f5bbf9cb57393b80c964ac0e6c75ee70ebd8c980d11bb503c01
    resource_class: small
    steps:
      - checkout
      - install-circleci-cli
      - run:
          name: Publish production orb
          command: scripts/publish-orb.sh production

  benchmark:
    docker:
      - image: cimg/go:1.27.3
    resource_class: medium
    steps:
      - checkout
      - install-circleci-cli
      - run:
          name: Build circleci-smarter
          command: |
            set -eu
            mkdir -p /tmp/smarter/bin
            CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=dev-$CIRCLE_SHA1" -o /tmp/smarter/bin/circleci-smarter ./cmd/circleci-smarter
      - run:
          name: Fetch workflow history
          environment:
            PROJECT_SLUG: "<< pipeline.project.slug >>"
          command: |
            set -eu
            mkdir -p /tmp/smarter
            scripts/bench/fetch-history.sh "$PROJECT_SLUG" ci 200 /tmp/smarter/history.json .
      - run:
          name: Backtest recall and savings
          command: |
            set -eu
            map=examples/monorepo/impact-map.json.gz
            if [ ! -s "$map" ]; then
              echo "benchmark: missing $map" >&2
              exit 1
            fi
            /tmp/smarter/bin/circleci-smarter backtest \
              --history /tmp/smarter/history.json \
              --map "$map" \
              --config .circleci/continue.yml \
              --workflow ci \
              --mandatory security-scan \
              --format md \
              > /tmp/smarter/backtest.md
            /tmp/smarter/bin/circleci-smarter backtest \
              --history /tmp/smarter/history.json \
              --map "$map" \
              --config .circleci/continue.yml \
              --workflow ci \
              --mandatory security-scan \
              --format json \
              > /tmp/smarter/backtest.json
      - store_artifacts:
          path: /tmp/smarter
          destination: backtest

workflows:
  # The docs site, published from main in a workflow of its own: the planner plans `ci` only and passes this workflow through, a
  # failed publication (an expired token, say) cannot hold the impact map or the gate of `ci`, and one publication runs at a
  # time, so that two quick merges cannot push to gh-pages together. The guardrails (policies/guardrails.rego) want the
  # security scan in every workflow, so this one runs it too, on main.
  docs-site:
    jobs:
      - security-scan:
          filters:
            branches:
              only: main
      - docs-site-publish:
          context: [smarter-workflows-release]
          serial-group: << pipeline.project.slug >>/docs-site-publish
          filters:
            branches:
              only: main

  ci:
    jobs:
      - go-test:
          context: [smarter-workflows-ci]
      - go-lint
      - policy-test
      - script-test
      - release-dry-run
      - docs-site-build
      - orb-validate:
          context: [smarter-workflows-ci]
      - security-scan
      - build
      - e2e-plan:
          requires:
            - build
      # Tags only. The same commit passed the branch pipeline, so a tag pipeline
      # holds for a person and releases: no job it requires needs a tag filter.
      - hold-release:
          type: approval
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
      - release:
          context: smarter-workflows-release
          requires:
            - hold-release
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
      - orb-publish-dev:
          context: smarter-workflows-release
          requires:
            - go-test
            - go-lint
            - policy-test
            - script-test
            - orb-validate
            - security-scan
            - build
            - e2e-plan
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
      - orb-publish-prod:
          context: smarter-workflows-release
          requires:
            - release
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
  benchmark:
    when: pipeline.trigger.type == "schedule"
    jobs:
      - security-scan
      - benchmark:
          context:
            - smarter-workflows-ai
