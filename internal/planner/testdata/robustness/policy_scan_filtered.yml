version: 2.1
jobs:
  security-scan:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: govulncheck ./...
  lint:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: make lint
workflows:
  ci:
    jobs:
      - security-scan:
          filters:
            branches:
              only: main
      - lint
