version: 2.1
jobs:
  lint:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: make lint
  build:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: make build
  cleanup:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: ./cleanup/run.sh
workflows:
  ci:
    jobs:
      - lint
      - build
      - cleanup:
          requires:
            - build:
                - success
                - failed
