version: 2.1
orbs:
  node: circleci/node@5.1.0
jobs:
  deploy:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: ./deploy/run.sh
workflows:
  ci:
    jobs:
      - node/test:
          name: unit-tests
      - node/test:
          name: integration-tests
      - deploy:
          requires:
            - unit-tests
