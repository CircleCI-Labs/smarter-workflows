version: 2.1
jobs:
  lint:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: make lint
  build:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: make build
  test:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: make test
  deploy:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: ./deploy/run.sh
  notify-canceled:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: ./notify/run.sh
workflows:
  ci:
    jobs:
      - lint
      - build
      - test:
          requires:
            - lint
            - build
      - notify-canceled:
          requires:
            - build: canceled
      - deploy:
          requires: [test]
