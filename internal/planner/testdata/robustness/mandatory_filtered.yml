version: 2.1
jobs:
  lint:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: make lint
  release-prep:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: make release-prep
  publish:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: ./release/publish.sh
workflows:
  ci:
    jobs:
      - lint
      - release-prep:
          filters:
            branches:
              only: main
      - publish:
          requires:
            - release-prep
