version: 2.1
jobs:
  test:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: make test
  deploy:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: ./deploy/run.sh
workflows:
  ci:
    jobs:
      - test
      - hold-deploy:
          type: approval
          filters:
            branches:
              only: main
      - deploy:
          requires:
            - hold-deploy
            - test
