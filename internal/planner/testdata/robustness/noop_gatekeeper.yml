version: 2.1
jobs:
  lint:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: make lint
  test:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: make test
  all-green:
    type: no-op
workflows:
  ci:
    jobs:
      - lint
      - test
      - all-green:
          requires:
            - lint
            - test
