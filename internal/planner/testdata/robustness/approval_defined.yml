version: 2.1
jobs:
  build:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: make build
  hold:
    type: approval
  deploy:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - run: ./deploy/run.sh
workflows:
  ci:
    jobs:
      - build
      - hold:
          requires:
            - build
      - deploy:
          requires:
            - hold
